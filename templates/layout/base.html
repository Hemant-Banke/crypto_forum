<!DOCTYPE html>

{% load static %}

<html lang="en-US">
<head>
    <title>{% block title %}{% endblock %}</title>

	<meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <!-- Descriptions -->
    <meta name="description" content="Use Crypto Forum to view reviews of popular blockchain platforms and technologies including Exchanges, Coins, Giveaways. Provide reviews of platforms you like or request us to add your favorites.">
    <meta name="author" content="Crypto Forum">
    <!-- OpenGraph Card -->
    <meta property="og:title" content="View Reviews of popular blockchain platforms and technologies" />
    <meta property="og:url" content="https://crypto-forum.herokuapp.com" />
    <meta property="og:type" content="website" />
    <meta property="og:description" content="Use Crypto Forum to view reviews of popular blockchain platforms and technologies including Exchanges, Coins, Giveaways. Provide reviews of platforms you like or request us to add your favorites." />
    <meta property="og:image" content="https://crypto-forum.herokuapp.com/static/img/og_banner.jpg" />
    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary" />
    <meta property="twitter:title" content="View Reviews of popular blockchain platforms and technologies" />
    <meta property="twitter:description" content="Use Crypto Forum to view reviews of popular blockchain platforms and technologies including Exchanges, Coins, Giveaways. Provide reviews of platforms you like or request us to add your favorites." />
    <meta property="twitter:url" content="https://crypto-forum.herokuapp.com" />
    <meta property="twitter:image" content="https://crypto-forum.herokuapp.com/static/img/og_banner.jpg" />


    <link rel='manifest' href='{% static "manifest.json" %}'>

    <script type="module">
        /*
        This code uses the pwa-update web component https://github.com/pwa-builder/pwa-update to register your service worker,
        tell the user when there is an update available and let the user know when your PWA is ready to use offline.
        */
        import 'https://cdn.jsdelivr.net/npm/@pwabuilder/pwaupdate';
        const el = document.createElement('pwa-update');
        document.body.appendChild(el);
    </script>

    <!-- Page Loader -->
    <style>
        .page-loader{
            width: 100%;
            height: 100%;
            background-color: #fff;
            position: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .page-loader img.page-loader-img{
            width: 80px;
            height: 80px;
            border-radius: 50%;
            box-shadow: 0px 0.125rem 0.25rem 2px rgba(0, 0, 0, 0.075);
        }
    </style>

	<!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="{% static "favicon/apple-touch-icon.png" %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static "favicon/favicon-32x32.png" %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static "favicon/favicon-16x16.png" %}">
    <link rel="manifest" href="{% static "favicon/site.webmanifest" %}">
    <link rel="mask-icon" href="{% static "safari-pinned-tab.svg" %}" color="#3fa9f5">
    <meta name="msapplication-TileColor" content="#3fa9f5">
    <meta name="theme-color" content="#ffffff">

	<!-- Bootstrap -->
    <link rel="preload" href="{% static "css/bootstrap.min.css" %}" as="style">
    <link rel="stylesheet" href="{% static "css/bootstrap.min.css" %}">

	<link rel="preload" href="{% static "css/style.css" %}" type="text/css" media="screen" as="style" />
	<link rel="stylesheet" href="{% static "css/style.css" %}" type="text/css" media="screen" />

	<!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

	<!-- Fonts -->
    <link rel="preload" href="{% static "css/all.css" %}" as="style">
    <link rel="stylesheet" href="{% static "css/all.css" %}">

    <link rel="preload" href="{% static "fonts/ubuntu/ubuntu-v14-latin-regular.woff2" %}" as="font" crossorigin>
    <link rel="preload" href="{% static "fonts/ubuntu/ubuntu-v14-latin-500.woff2" %}" as="font" crossorigin>
    <link rel="preload" href="{% static "fonts/ubuntu/ubuntu-v14-latin-700.woff2" %}" as="font" crossorigin>
    <style>
        /* ubuntu-regular - latin */
        @font-face {
            font-family: 'Ubuntu';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('{% static "fonts/ubuntu/ubuntu-v14-latin-regular.eot" %}'); /* IE9 Compat Modes */
            src: local('Ubuntu Regular'), local('Ubuntu-Regular'),
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-regular.eot" %}?#iefix') format('embedded-opentype'), /* IE6-IE8 */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-regular.woff2" %}') format('woff2'), /* Super Modern Browsers */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-regular.woff" %}') format('woff'), /* Modern Browsers */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-regular.ttf" %}') format('truetype'), /* Safari, Android, iOS */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-regular.svg" %}#Ubuntu') format('svg'); /* Legacy iOS */
        }
        /* ubuntu-500 - latin */
        @font-face {
            font-family: 'Ubuntu';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('{% static "fonts/ubuntu/ubuntu-v14-latin-500.eot" %}'); /* IE9 Compat Modes */
            src: local('Ubuntu Medium'), local('Ubuntu-Medium'),
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-500.eot" %}?#iefix') format('embedded-opentype'), /* IE6-IE8 */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-500.woff2" %}') format('woff2'), /* Super Modern Browsers */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-500.woff" %}') format('woff'), /* Modern Browsers */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-500.ttf" %}') format('truetype'), /* Safari, Android, iOS */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-500.svg" %}#Ubuntu') format('svg'); /* Legacy iOS */
        }
        /* ubuntu-700 - latin */
        @font-face {
            font-family: 'Ubuntu';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('{% static "fonts/ubuntu/ubuntu-v14-latin-700.eot" %}'); /* IE9 Compat Modes */
            src: local('Ubuntu Bold'), local('Ubuntu-Bold'),
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-700.eot" %}?#iefix') format('embedded-opentype'), /* IE6-IE8 */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-700.woff2" %}') format('woff2'), /* Super Modern Browsers */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-700.woff" %}') format('woff'), /* Modern Browsers */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-700.ttf" %}') format('truetype'), /* Safari, Android, iOS */
                url('{% static "fonts/ubuntu/ubuntu-v14-latin-700.svg" %}#Ubuntu') format('svg'); /* Legacy iOS */
        }
    </style>


	{% block extra_head %}
	{% endblock %}
</head>
