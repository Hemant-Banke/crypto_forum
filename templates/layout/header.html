{% load static %}

<!-- Header -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container container-large">

        <div class="nav-item mr-3">
            <a href="/" class="navbar-brand mr-0">
                <div class="brand brand-text-right">
                    <img class="brand-logo lazyload mr-0" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII="
                        data-src="{% static "img/logo.png" %}" alt="Crypto Scammer Logo">
                    <span class="brand-text ml-3 display-md">Crypto Scammer</span>
                </div>
            </a>
        </div>

        <div class="nav-item nav-grow display-mobile">
            <div class="input-group-pre">
                <div class="input-group-icon">
                    <span class="text-primary"><i class="fas fa-search"></i></span>
                </div>
                <input type="text" id="main-s" name="main-s" class="form-control" placeholder="Search Platform">
            </div>
        </div>

        <button class="navbar-toggler border-0 ml-2" type="button" data-toggle="collapse" data-target="#navbarToggle" aria-controls="navbarToggle" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarToggle">

            <ul class="navbar-nav ml-auto">
                {% if user.is_authenticated %}

                <!-- Profile Section -->
                <li class="nav-item drop-down">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">

                        <div class="navbar-profile">
                            <div class="profile-icon mr-3">
                                <img class="lazyload" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII="
                                    data-src="{% static "img/user.png" %}" alt="User Icon">
                            </div>

                            <div class="profile-name">
                                <span>{{ user.username }}</span>
                            </div>
                        </div>

                    </a>
                    <div class="dropdown-menu profile-dropdown" aria-labelledby="navbarDropdown">
                        <a class="dropdown-item" href="{% url 'users:profile' user.username %}"><i class="fas fa-user"></i> Profile</a>
                        <a class="dropdown-item" href="{% url 'main:support' %}"><i class="fas fa-medkit"></i> Support</a>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="{% url 'users:logout' %}"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </div>
                </li>
                {% else %}

                    <li class="nav-item">
                        <div class="nav-link">
                            <a href="{% url 'users:login' %}" class="btn btn-secondary btn-main">Log In <i class="fas fa-arrow-right"></i></a>
                        </div>
                    </li>
                    <li class="nav-item">
                        <div class="nav-link">
                            <a href="{% url 'users:registration' %}" class="btn btn-primary btn-main">Sign Up <i class="fas fa-arrow-right"></i></a>
                        </div>
                    </li>

                {% endif %}
            </ul>
        </div>

    </div>
</nav>


<noscript>
    <!-- Alert for no JS -->
    <div class="alert alert-nav alert-danger alert-dismissible fade show">
        <div class="container container-large position-relative">
            Our site works best with JavaScript enabled!
            <button class="btn alert-close" data-dismiss="alert" aria-label="close"><i class="fas fa-times"></i></button>
        </div>
    </div>
</noscript>


<!-- Search Area -->
<div class="search-area" id="search-area">
    <div class="container container-large">
        <h6 class="card-subhead-text">Search Results :</h6>
        <div id="search-results"></div>
    </div>
</div>
